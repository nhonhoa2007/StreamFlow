# Stage B: NGINX Reverse Proxy + 2 API Replicas + Media Worker + Backing Services
name: streamflow-stage-b

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: streamflow-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - streamflow-net
    restart: unless-stopped

  api-1:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: streamflow-api-1
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/streamflow
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
      STORAGE_BUCKET_NAME: streamflow-media-dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streamflow-net
    restart: unless-stopped

  api-2:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: streamflow-api-2
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/streamflow
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
      STORAGE_BUCKET_NAME: streamflow-media-dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streamflow-net
    restart: unless-stopped

  media-worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: streamflow-media-worker
    command: ["node", "backend/apps/media-worker/dist/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/streamflow
      REDIS_URL: redis://redis:6379
      TRANSCODE_QUEUE_NAME: media-transcode-queue
      TRANSCODE_CONCURRENCY: 2
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET_NAME: streamflow-media-dev
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streamflow-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: streamflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: streamflow
    volumes:
      - streamflow_stage_b_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamflow"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - streamflow-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: streamflow-redis
    volumes:
      - streamflow_stage_b_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - streamflow-net
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: streamflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - streamflow_stage_b_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - streamflow-net
    restart: unless-stopped

  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: streamflow-stage-b-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set};
      /usr/bin/mc mb local/streamflow-media-dev --ignore-existing;
      exit 0;
      "
    networks:
      - streamflow-net

volumes:
  streamflow_stage_b_pg_data:
  streamflow_stage_b_redis_data:
  streamflow_stage_b_minio_data:

networks:
  streamflow-net:
    driver: bridge
