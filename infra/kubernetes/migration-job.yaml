apiVersion: batch/v1
kind: Job
metadata:
  name: streamflow-db-migration
  namespace: streamflow
  labels:
    app.kubernetes.io/name: streamflow-db-migration
    app.kubernetes.io/part-of: streamflow-platform
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamflow-db-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: migrate
          image: streamflow-api:latest
          command: ["node", "backend/packages/database/dist/src/migrate.js"]
          envFrom:
            - configMapRef:
                name: streamflow-config
            - secretRef:
                name: streamflow-secret
