apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflow-workers
  namespace: streamflow
  labels:
    app.kubernetes.io/name: streamflow-workers
    app.kubernetes.io/part-of: streamflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamflow-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamflow-workers
        app.kubernetes.io/part-of: streamflow-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: media-worker
          image: streamflow-worker:latest
          command: ["node", "backend/apps/media-worker/dist/index.js"]
          envFrom:
            - configMapRef:
                name: streamflow-config
            - secretRef:
                name: streamflow-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

        - name: event-relay
          image: streamflow-worker:latest
          command: ["node", "backend/apps/event-relay/dist/index.js"]
          envFrom:
            - configMapRef:
                name: streamflow-config
            - secretRef:
                name: streamflow-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

        - name: analytics-consumer
          image: streamflow-worker:latest
          command: ["node", "backend/apps/analytics-consumer/dist/index.js"]
          envFrom:
            - configMapRef:
                name: streamflow-config
            - secretRef:
                name: streamflow-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
