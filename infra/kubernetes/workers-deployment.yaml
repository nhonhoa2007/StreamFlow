apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamflow-media-worker
  namespace: streamflow
  labels:
    app.kubernetes.io/name: streamflow-media-worker
    app.kubernetes.io/part-of: streamflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamflow-media-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamflow-media-worker
        app.kubernetes.io/part-of: streamflow-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-worker
          image: streamflow-api:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["node", "backend/apps/media-worker/dist/index.js"]
          volumeMounts:
            - name: worker-tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: streamflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamflow-secret
                  key: DATABASE_URL
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: streamflow-secret
                  key: STORAGE_ACCESS_KEY_ID
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: streamflow-secret
                  key: STORAGE_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
      volumes:
        - name: worker-tmp
          emptyDir: {}
---
