apiVersion: v1
kind: Secret
metadata:
  name: streamflow-secret
  namespace: streamflow
  labels:
    app.kubernetes.io/name: streamflow-secret
    app.kubernetes.io/part-of: streamflow-platform
type: Opaque
# This file is a schema example only. Create the real secret out of band, for
# example with `kubectl create secret generic streamflow-secret --from-env-file=.env`.
# It is intentionally excluded from kustomization.yaml so credentials are not
# committed or applied with the application manifests.
stringData:
  DATABASE_URL: "REPLACE_WITH_DATABASE_URL"
  JWT_SECRET: "REPLACE_WITH_RANDOM_JWT_SECRET"
  STORAGE_ACCESS_KEY_ID: "REPLACE_WITH_STORAGE_ACCESS_KEY_ID"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE_WITH_STORAGE_SECRET_ACCESS_KEY"
