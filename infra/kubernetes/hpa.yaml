apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamflow-api-hpa
  namespace: streamflow
  labels:
    app.kubernetes.io/name: streamflow-api-hpa
    app.kubernetes.io/part-of: streamflow-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamflow-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
